<!DOCTYPE html>
<html>
<head>
  <title>Open Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    a button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px;
      color: white;
    }
    /* Google Drive style */
    .gdrive {
      background-color: #34A853; /* Google green */
    }
    .gdrive:hover {
      background-color: #2c8c46;
    }
    /* GitHub style */
    .github {
      background-color: #24292e; /* GitHub dark gray */
    }
    .github:hover {
      background-color: #000000;
    }
  </style>
</head>
<body>
  <a href="https://drive.google.com/drive/folders/1IbBiO-CtdqALmoBeSywQx3tWxoci2hld?usp=drive_link" target="_blank">
    <button class="gdrive">Open GDrive</button>
  </a>
  <a href="https://github.com/Pavan-M-S" target="_blank">
    <button class="github">Open GitHub</button>
  </a>
</body>
</html>
